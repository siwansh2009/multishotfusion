name: Build MultiShot Fusion Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unpack original project
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          unzip -q "$ZIP"
          test -f MultiShotFusion/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        working-directory: MultiShotFusion
        run: npm install --no-audit --no-fund
      - name: Run project tests
        working-directory: MultiShotFusion
        run: npm test
      - name: Generate Android project
        working-directory: MultiShotFusion
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
      - name: Build debug APK
        working-directory: MultiShotFusion/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK="MultiShotFusion/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MultiShot-Fusion-debug-APK
          path: MultiShotFusion/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
