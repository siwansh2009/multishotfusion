name: Build MultiShot Fusion Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unpack original project
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          unzip -q "$ZIP"
          test -f MultiShotFusion/package.json
      - name: Fix native Android Kotlin sources
        working-directory: MultiShotFusion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("native-android/java/com/multishotfusion/camera")

          # CameraManager Handler overload order is (cameraId, callback, handler).
          for name in ("ConcurrentCaptureController.kt", "SequentialCaptureController.kt"):
              path = base / name
              source = path.read_text()
              pattern = re.compile(
                  r'manager\.openCamera\(logical\.id,\s*handler,\s*'
                  r'(object : CameraDevice\.StateCallback\(\) \{.*?\n\s*\})\)',
                  re.S,
              )
              source, count = pattern.subn(
                  lambda match: "manager.openCamera(logical.id, " + match.group(1) + ", handler)",
                  source,
              )
              if count != 1:
                  raise SystemExit(f"{name}: expected one openCamera call to fix, found {count}")
              path.write_text(source)

          # Values are assigned in the concurrent and fallback branches.
          path = base / "MultiShotFusionModule.kt"
          source = path.read_text()
          old = "\n".join([
              "        val usedIds: List<String>",
              "        val mode: String",
              "        val jpegById: Map<String, ByteArray>",
          ])
          new = "\n".join([
              "        var usedIds: List<String> = emptyList()",
              "        var mode: String = \"sequential\"",
              "        var jpegById: Map<String, ByteArray> = emptyMap()",
          ])
          if old not in source:
              raise SystemExit("MultiShotFusionModule.kt: declaration block not found")
          path.write_text(source.replace(old, new, 1))

          # Ensure the custom ReactPackage can be added to a mutable package list.
          path = Path("plugins/withMultiShotFusion.js")
          source = path.read_text()
          old = "PackageList(this).packages.apply {"
          new = "PackageList(this).packages.toMutableList().apply {"
          if old not in source:
              raise SystemExit("withMultiShotFusion.js: PackageList insertion point not found")
          path.write_text(source.replace(old, new, 1))

          print("Patched Camera2 callback order, capture result variables, and package registration.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        working-directory: MultiShotFusion
        run: npm install --no-audit --no-fund
      - name: Run project tests
        working-directory: MultiShotFusion
        run: npm test
      - name: Generate Android project
        working-directory: MultiShotFusion
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
      - name: Set Kotlin version compatible with Compose compiler
        working-directory: MultiShotFusion/android
        run: |
          if grep -q '^android.kotlinVersion=' gradle.properties; then
            sed -i 's/^android.kotlinVersion=.*/android.kotlinVersion=1.9.25/' gradle.properties
          else
            echo 'android.kotlinVersion=1.9.25' >> gradle.properties
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          old = "classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')"
          new = "classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')"
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit("Could not find Kotlin Gradle plugin declaration in android/build.gradle")
          p.write_text(s)
          PY
          echo "--- Kotlin version settings ---"
          grep -n -E 'android.kotlinVersion|kotlin-gradle-plugin' gradle.properties build.gradle
      - name: Build debug APK
        working-directory: MultiShotFusion/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK="MultiShotFusion/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MultiShot-Fusion-debug-APK
          path: MultiShotFusion/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
